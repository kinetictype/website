<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="aspect-ratio" content="1400/1200">
<title>help.fitbit.com redesign: mobile prototype</title>
<style>
@font-face{font-family:"Roboto";src:url("prototype-fonts/roboto-latin-300-normal.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Roboto";src:url("prototype-fonts/roboto-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Roboto";src:url("prototype-fonts/roboto-latin-500-normal.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Roboto";src:url("prototype-fonts/roboto-latin-700-normal.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Roboto";src:url("prototype-fonts/roboto-latin-900-normal.woff2") format("woff2");font-weight:900;font-style:normal;font-display:swap}
@font-face{font-family:"Roboto";src:url("prototype-fonts/roboto-latin-400-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}

body{margin:0;background:#C1CCD6}
a{color:#00737B}a:hover{color:#005A60}
*{box-sizing:border-box}
.fb button{font-family:inherit}
.fb input{font-family:inherit}
.scroller{scroll-behavior:smooth}
.scroller::-webkit-scrollbar{width:0}
.chip{border:0;border-radius:999px;padding:7px 14px;font-size:15px;font-weight:400;color:#fff;background:#5B7282;cursor:pointer;line-height:1.2;min-height:34px}
.chip:hover{background:#5B7282;filter:brightness(.88)}
.chip.on{background:#00828B}
.chip.on:hover{background:#006E76}
.pill{border-radius:999px;padding:10px 26px;font-size:18px;font-weight:600;cursor:pointer;min-height:44px;border:1.5px solid #00828B;background:#00828B;color:#fff}
.pill:hover{background:#006E76;border-color:#006E76}
.pill:disabled{background:#C1CCD6;border-color:#C1CCD6;color:#5B7282;cursor:not-allowed}
.ghost{border-radius:999px;padding:10px 26px;font-size:18px;font-weight:400;cursor:pointer;min-height:44px;border:1.5px solid #5B7282;background:#fff;color:#5B7282}
.ghost:hover{background:rgba(193,204,214,.3)}
.textlink{background:none;border:0;padding:0;color:#00737B;cursor:pointer;font:inherit;text-align:left}
.textlink:hover{color:#005A60;text-decoration:underline}
.cat{background:none;border:0;padding:8px 0;font-size:14px;font-weight:800;letter-spacing:.04em;color:#00737B;cursor:pointer;text-align:left;border-bottom:2px solid transparent;align-self:flex-start;min-height:36px}
.cat.on{border-bottom-color:#00828B}
.prod{width:132px;height:132px;border-radius:50%;border:0;background:#C1CCD6;color:#5B7282;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:800;padding:0}
.prod:hover{filter:brightness(.95)}
.prod.on{background:#00828B;color:#fff}
.dot{width:24px;height:24px;border-radius:50%;background:#3E5463;display:flex;align-items:center;justify-content:center}
.dot.cur{background:#00939C}
.dot.done{background:#00939C}
.steplabel{font-size:13px;font-weight:800;letter-spacing:.05em;color:#00737B;height:18px}
.steplabel.hide{visibility:hidden}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid #3E5463;padding:14px 20px;font-size:19px;color:#5B7282;cursor:pointer;text-align:left;min-height:52px}
.row:hover{background:rgba(193,204,214,.3)}
.artitem{display:block;width:100%;background:none;border:0;border-bottom:1px solid #3E5463;padding:14px 20px;text-align:left;cursor:pointer;color:#5B7282}
.artitem:hover{background:rgba(193,204,214,.3)}
.tool{background:none;border:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#0A7AFF;padding:0}
.tool:disabled{color:#C1CCD6;cursor:default}
.fab{width:46px;height:46px;border:0;padding:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.menuitem{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #3E5463;padding:15px 24px;font-size:18px;color:#5B7282;cursor:pointer;min-height:52px}
.menuitem:hover{background:rgba(193,204,214,.3)}
.field{width:100%;border:1.5px solid #5B7282;border-radius:999px;padding:11px 46px 11px 18px;font-size:17px;color:#5B7282;background:#fff;outline:none}
.field:focus{border-color:#00828B;box-shadow:0 0 0 3px rgba(0,130,139,.18)}
.box{width:100%;border:1.5px solid #5B7282;border-radius:8px;padding:12px 14px;font-size:17px;color:#5B7282;background:#fff;outline:none}
.box:focus{border-color:#00828B;box-shadow:0 0 0 3px rgba(0,130,139,.18)}
.underline{width:100%;border:0;border-bottom:1.5px solid #3E5463;padding:8px 0;font-size:17px;color:#5B7282;background:transparent;outline:none}
.underline:focus{border-bottom-color:#00828B}
.tile{background:#fff;border:1.5px solid #C1CCD6;border-radius:12px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:#5B7282;width:100%}
.tile:hover{border-color:#00828B}
.yn{border:1.5px solid #5B7282;background:#fff;border-radius:999px;padding:8px 22px;font-size:16px;cursor:pointer;color:#5B7282;min-height:40px}
.yn:hover{border-color:#00828B}
.flip{transform:rotate(180deg)}
.ld{display:block;width:10px;height:10px;border-radius:50%;background:#fff}
.ld.on{background:#00828B}
.star{fill:none;stroke:#5B7282}
.star.on{fill:#00828B;stroke:#00828B}
.ptab{border:1.5px solid #C1CCD6;background:#fff;color:#3E5463;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;min-height:32px}
.ptab:hover{border-color:#00828B}
.ptab.on{background:#00828B;border-color:#00828B;color:#fff}
.ctl{width:40px;height:40px;border-radius:50%;border:1.5px solid #C1CCD6;background:#fff;color:#3E5463;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ctl:hover{border-color:#00828B;color:#00828B}
.ctl.main{width:48px;height:48px;background:#00828B;border-color:#00828B;color:#fff}
.ctl.main:hover{background:#006E76;color:#fff}
.seg{flex:1;height:4px;border-radius:2px;background:#C1CCD6}
.seg.done{background:#00828B}
.seg.cur{background:#00939C}

html,body{margin:0;height:100%;overflow:hidden;background:#FF9B00}
#stage{position:absolute;left:0;top:0;width:1400px;height:1200px;transform-origin:0 0}
#stage button,#stage input{font-family:inherit}
</style>
</head>
<body>
<div id="stage"></div>
<template id="tpl"><div style="width: 1400px; height: 1200px; position: relative; overflow: hidden; background: #FF9B00; font-family: Roboto, 'Helvetica Neue', Arial, sans-serif">
  <svg aria-hidden="true" width="1400" height="1200" style="position: absolute; left: 0; top: 0"><polygon points="575,89 435,229 824,1108 964,968" fill="#CC7C00"></polygon><rect x="416" y="210" width="427" height="917" rx="64" fill="#CC7C00"></rect></svg>

  <!-- story caption + player controls -->
  <div style="position: absolute; left: 48px; top: 56px; width: 340px; background: #fff; border-radius: 18px; padding: 18px 20px 16px; box-shadow: 0 8px 24px rgba(120,60,0,.18)">
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px">
      <sc-for list="{{personaTabs}}" as="pt" hint-placeholder-count="4">
        <button class="ptab {{pt.cls}}" aria-pressed="{{pt.on}}" onClick="{{pt.go}}">{{pt.label}}</button>
      </sc-for>
    </div>
    <div style="font-size: 15px; font-weight: 700; color: #00737B">{{capPersona}} · Step {{capNum}} of {{capTotal}}</div>
    <div style="font-size: 21px; font-weight: 700; line-height: 1.3; color: #3E5463; margin: 6px 0 14px; min-height: 55px">{{capText}}</div>
    <div style="display: flex; gap: 3px; margin-bottom: 14px" aria-hidden="true">
      <sc-for list="{{segs}}" as="sg" hint-placeholder-count="21">
        <span class="seg {{sg.cls}}"></span>
      </sc-for>
    </div>
    <div style="font-size: 14px; color: #5B7282; line-height: 1.35">{{playNote}}</div>
  </div>

  <!-- iPhone (white) -->
  <div style="position: absolute; left: 556px; top: 70px; width: 427px; height: 917px; border-radius: 64px; background: #F6F7F8; box-shadow: inset 0 0 0 2px #D2D6DA, inset 0 0 0 7px #FCFCFD, inset 0 0 0 8.5px #E2E5E8, 0 2px 0 #D9DCE0">
    <div aria-hidden="true" style="position: absolute; left: -5px; top: 118px; width: 5px; height: 26px; border-radius: 3px 0 0 3px; background: #D5D9DD"></div>
    <div aria-hidden="true" style="position: absolute; left: -5px; top: 178px; width: 5px; height: 46px; border-radius: 3px 0 0 3px; background: #D5D9DD"></div>
    <div aria-hidden="true" style="position: absolute; left: -5px; top: 238px; width: 5px; height: 46px; border-radius: 3px 0 0 3px; background: #D5D9DD"></div>
    <div aria-hidden="true" style="position: absolute; right: 70px; top: -5px; width: 56px; height: 5px; border-radius: 3px 3px 0 0; background: #D5D9DD"></div>
    <div aria-hidden="true" style="position: absolute; left: 50%; top: 40px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: #3A4A55; box-shadow: inset 0 0 0 3px #22303A"></div>
    <div aria-hidden="true" style="position: absolute; left: 50%; top: 72px; width: 72px; height: 9px; margin-left: -36px; border-radius: 5px; background: #3A4148; box-shadow: inset 0 0 0 2px #2A3036"></div>
    <div onPointerDown="{{touch}}" onWheel="{{touch}}" style="position: absolute; left: 26px; top: 125px; width: 375px; height: 667px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1.5px #C9CED3">
<div class="fb" style="width: 375px; height: 667px; position: relative; display: flex; flex-direction: column; overflow: hidden; background: #fff; font-family: Roboto, 'Helvetica Neue', Arial, sans-serif; color: #5B7282">

  <!-- iOS status bar (as in the original mockup) -->
  <div aria-hidden="true" style="flex: none; height: 20px; background: rgba(193,204,214,.3); display: flex; align-items: center; justify-content: space-between; padding: 0 6px; font-size: 12px; font-weight: 700; color: #111; font-family: Roboto, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <div style="display: flex; align-items: center; gap: 4px; width: 110px">
      <svg width="34" height="7" viewBox="0 0 34 7"><circle cx="3.5" cy="3.5" r="3" fill="#111"></circle><circle cx="10.5" cy="3.5" r="3" fill="#111"></circle><circle cx="17.5" cy="3.5" r="3" fill="#111"></circle><circle cx="24.5" cy="3.5" r="3" fill="none" stroke="#111" stroke-width="1"></circle><circle cx="31" cy="3.5" r="2.5" fill="none" stroke="#111" stroke-width="1"></circle></svg>
      <span style="font-weight: 400">AT&amp;T</span>
      <svg width="13" height="10" viewBox="0 0 13 10"><path d="M6.5 9.5L.6 3.4a8.5 8.5 0 0 1 11.8 0z" fill="#111"></path></svg>
    </div>
    <span>9:57 AM</span>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 4px; width: 110px; font-weight: 400">
      <svg width="7" height="11" viewBox="0 0 7 11" fill="none" stroke="#111" stroke-width="1.1"><path d="M1 3l5 5-2.5 2.5V.5L6 3 1 8"></path></svg>
      <span>89%</span>
      <svg width="25" height="11" viewBox="0 0 25 11"><rect x=".5" y=".5" width="21" height="10" rx="2.5" fill="none" stroke="#111"></rect><rect x="2" y="2" width="17" height="7" rx="1.2" fill="#111"></rect><rect x="22.5" y="3.5" width="2" height="4" rx="1" fill="#111"></rect></svg>
    </div>
  </div>
  <!-- Safari address bar -->
  <div style="flex: none; background: rgba(193,204,214,.3); padding: 2px 10px 6px; border-bottom: 1px solid #3E5463">
    <div style="display: flex; align-items: center; justify-content: center; position: relative; background: rgba(193,204,214,.6); border-radius: 9px; height: 30px; font-size: 14px; color: #5B7282">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5B7282" stroke-width="2.5" aria-hidden="true" style="margin-right: 6px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      <span>{{host}}</span>
      <button class="tool" aria-label="Reload" onClick="{{reload}}" style="position: absolute; right: 0; top: -7px; color: #5B7282">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"></path><path d="M20 4v5h-5"></path></svg>
      </button>
    </div>
  </div>

  <div id="fb-scroller" class="scroller" style="flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; position: relative; background: #fff">

    <!-- ===== help.fitbit.com header ===== -->
    <sc-if value="{{showHelpHeader}}" hint-placeholder-val="{{ true }}">
      <div style="position: sticky; top: 0; z-index: 5; background: #fff">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #3E5463">
          <button class="tool" aria-label="Open menu" onClick="{{openMenu}}" style="color: #00828B">
            <svg width="24" height="20" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M2 3h20M2 10h20M2 17h20"></path></svg>
          </button>
          <button class="textlink" onClick="{{goHome}}" style="font-size: 22px; font-weight: 300; color: #00737B; letter-spacing: .01em">fitbit help</button>
          <sc-if value="{{loggedOut}}" hint-placeholder-val="{{ true }}">
            <button class="textlink" onClick="{{openLogin}}" style="font-size: 17px; font-weight: 700; padding: 10px 10px; min-height: 44px">Log in</button>
          </sc-if>
          <sc-if value="{{loggedIn}}" hint-placeholder-val="{{ false }}">
            <button aria-label="Account menu" onClick="{{openMenu}}" style="width: 36px; height: 36px; margin: 4px 8px; border-radius: 50%; border: 0; background: #00828B; color: #fff; font-weight: 800; font-size: 16px; cursor: pointer">A</button>
          </sc-if>
        </div>
        <button class="row" onClick="{{learnProduct}}">
          <span>{{rowLabel}}</span>
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#5B7282" stroke-width="1.8" aria-hidden="true"><path d="M2 2l8 8-8 8"></path></svg>
        </button>
      </div>
    </sc-if>

    <!-- ===== HOME ===== -->
    <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
      <div>
        <sc-if value="{{showRecent}}" hint-placeholder-val="{{ true }}">
          <div style="background: #E6F4F5">
            <button onClick="{{toggleRecent}}" aria-expanded="{{recentOpen}}" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: #00828B; color: #fff; border: 0; padding: 10px 20px; font-size: 15px; font-weight: 800; letter-spacing: .04em; cursor: pointer; min-height: 44px">
              <span>RECENT ISSUES · 2</span>
              <span style="font-size: 14px; font-weight: 600; letter-spacing: 0">{{recentToggleLabel}}</span>
            </button>
            <sc-if value="{{recentOpen}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-direction: column">
                <sc-for list="{{recentIssues}}" as="ri" hint-placeholder-count="2">
                  <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 20px; border-bottom: 1px solid #C9E5E7">
                    <div style="flex: 1; min-width: 0">
                      <div style="font-size: 16px; font-weight: 800; color: #5B7282">{{ri.title}}</div>
                      <div style="font-size: 14px; color: #5B7282; line-height: 1.4; margin-top: 2px">{{ri.body}}</div>
                    </div>
                    <button class="pill" onClick="{{ri.open}}" style="padding: 6px 14px; font-size: 14px; min-height: 36px; flex: none">more</button>
                  </div>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <sc-if value="{{loggedIn}}" hint-placeholder-val="{{ false }}">
          <div style="margin: 16px 16px 0; border: 1.5px solid #C1CCD6; border-radius: 14px; overflow: hidden">
            <div style="background: #F4F9FA; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
              <div>
                <div style="font-size: 20px; font-weight: 800">Hi, Allie</div>
                <div style="font-size: 13px; color: #5B7282">English (US) · United States</div>
              </div>
              <div style="font-size: 13px; color: #00737B; font-weight: 700">Case history: none open</div>
            </div>
            <div style="padding: 12px 16px; display: flex; gap: 12px; align-items: center; border-top: 1px solid #3E5463">
              <div style="width: 52px; height: 52px; border-radius: 50%; background: #C1CCD6; color: #fff; display: flex; align-items: center; justify-content: center; flex: none">
                <svg width="34" height="13" viewBox="0 17 56 22" aria-hidden="true"><circle cx="7.2" cy="28" r="3.2" fill="#fff"></circle><circle cx="17.6" cy="28" r="3.2" fill="#fff"></circle><circle cx="28" cy="28" r="3.2" fill="#fff"></circle><circle cx="38.4" cy="28" r="3.2" fill="#fff"></circle><circle cx="48.8" cy="28" r="3.2" fill="#fff"></circle></svg>
              </div>
              <div style="flex: 1; min-width: 0; font-size: 14px; line-height: 1.45">
                <div style="font-size: 17px; font-weight: 800">Flex 2</div>
                <div>Warranty: <b>active</b> · Returns: eligible</div>
                <div>Sync: last synced today — <b>faster than most</b></div>
              </div>
            </div>
            <div style="padding: 10px 16px; background: #FFF6E5; border-top: 1px solid #F1E0BC; display: flex; justify-content: space-between; align-items: center; gap: 8px">
              <div style="font-size: 14px; color: #5A4300"><b>Battery is low.</b> Charge your Flex 2 soon.</div>
              <button class="textlink" onClick="{{openBattery}}" style="font-size: 14px; font-weight: 800">How to charge</button>
            </div>
            <sc-if value="{{hasViewed}}" hint-placeholder-val="{{ false }}">
              <div style="padding: 12px 16px; border-top: 1px solid #3E5463">
                <div style="font-size: 12px; font-weight: 800; letter-spacing: .05em; color: #5B7282; margin-bottom: 6px">ARTICLES YOU'VE VIEWED</div>
                <sc-for list="{{viewedItems}}" as="v" hint-placeholder-count="2">
                  <div><button class="textlink" onClick="{{v.open}}" style="font-size: 15px; padding: 4px 0">{{v.title}}</button></div>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-if>

        <!-- wizard step 1 -->
        <div style="padding: 14px 0 0">
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); position: relative; padding: 0 30px">
            <div style="position: absolute; left: 0; right: 0; bottom: 11px; height: 1px; background: #3E5463"></div>
            <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
              <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative">
                <div class="steplabel {{st.labelCls}}">{{st.label}}</div>
                <div class="dot {{st.dotCls}}">
                  <sc-if value="{{st.done}}" hint-placeholder-val="{{ false }}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
                  </sc-if>
                </div>
              </div>
            </sc-for>
          </div>
          <div style="padding: 18px 20px 0">
            <h1 style="margin: 0 0 14px 14px; font-size: 22px; font-weight: 400; color: #00737B">How can we help?</h1>
            <form onSubmit="{{submitSearch}}" style="position: relative; margin: 0">
              <label for="kw" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search keywords</label>
              <input id="kw" class="field" type="search" placeholder="search keywords" value="{{query}}" onChange="{{onQuery}}">
              <button type="submit" aria-label="Search" style="position: absolute; right: 6px; top: 3px; width: 40px; height: 40px; border: 0; background: none; cursor: pointer; color: #5B7282">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg>
              </button>
            </form>
            <div style="display: flex; flex-wrap: wrap; gap: 9px 8px; margin-top: 16px">
              <sc-for list="{{issueChips}}" as="c" hint-placeholder-count="11">
                <button class="chip {{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button>
              </sc-for>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 18px 0 6px">
              <button class="fab" aria-label="Chat with the help assistant" onClick="{{openChat}}">
                <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><path d="M23 4a19 19 0 1 1-10.6 34.8L4 42l3.3-8A19 19 0 0 1 23 4z" fill="#00939C"></path><path d="M23 14v18M14 23h18" stroke="#fff" stroke-width="3" stroke-linecap="round"></path></svg>
              </button>
              <button class="pill" disabled="{{issueNextDisabled}}" onClick="{{issueNext}}">next</button>
            </div>
          </div>
        </div>

        <!-- categories -->
        <div style="padding: 10px 20px 4px; display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{cats}}" as="ct" hint-placeholder-count="4">
            <button class="cat {{ct.cls}}" aria-pressed="{{ct.on}}" onClick="{{ct.pick}}">{{ct.label}}</button>
          </sc-for>
        </div>

        <div style="border-top: 1px solid #3E5463; margin-top: 12px">
          <button onClick="{{toggleList}}" aria-expanded="{{listOpen}}" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; border-bottom: 1px solid #3E5463; padding: 16px 20px; font-size: 20px; font-weight: 700; color: #5B7282; cursor: pointer">
            <span>Article list</span>

                  <p style="margin: 0 0 8px; font-size: 17px; line-height: 1.5; color: #5B7282">{{pr.problem}}</p>

                        </sc-for>

                      <span style="font-size: 15px; color: #5B7282">{{lr.label}}</span>
                    </div>

                </div>
              </sc-if>
            </section>
          </sc-for>
        </div>
        <div style="margin: 10px 20px 4px; padding: 14px 16px; background: rgba(193,204,214,.3); border-radius: 12px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">

                <button onClick="{{st.pick}}" aria-label="{{st.label}}" aria-pressed="{{st.on}}" style="width: 32px; height: 36px; border: 0; background: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center">
                  <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" class="star {{st.cls}}"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" stroke-width="1.6" stroke-linejoin="round"></path></svg>
                </button>

            </div>
          </div>
          <sc-if value="{{ratedGood}}" hint-placeholder-val="{{ false }}">
            <div style="font-size: 15px; color: #5B7282; margin-top: 8px">Thanks — glad that helped.</div>
          </sc-if>
          <sc-if value="{{ratedBad}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px">
              <span style="font-size: 15px; color: #5B7282">Sorry about that.</span>

        </div>
        <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 2px">

    <!-- ===== WEB SEARCH (third party) ===== -->
    <sc-if value="{{isWeb}}" hint-placeholder-val="{{ false }}">

              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg>
            </button>
          </form>
          <div style="display: flex; gap: 22px; padding: 12px 6px 0; font-size: 12px; font-weight: 700; color: #5B7282; border-bottom: 1px solid #3E5463">
            <span style="color: #2A62D6; border-bottom: 3px solid #2A62D6; padding-bottom: 8px">ALL</span><span>VIDEOS</span><span>NEWS</span><span>SHOPPING</span>
          </div>
        </div>
        <div style="padding: 10px 8px 20px; display: flex; flex-direction: column; gap: 10px; background: rgba(193,204,214,.3)">
          <sc-for list="{{webResults}}" as="w" hint-placeholder-count="3">
            <div style="background: #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.15)">
              <button onClick="{{w.open}}" style="display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; padding: 12px 14px 8px; border-bottom: 1px solid #3E5463; font-family: inherit">
                <div style="font-size: 17px; line-height: 1.3; color: #5A2CA0">{{w.title}}</div>
                <div style="font-size: 13px; color: #1B7A3A; margin-top: 3px">{{w.crumb}}</div>
              </button>
              <div style="padding: 8px 14px 12px; font-size: 14px; line-height: 1.45; color: #333">{{w.snippet}}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <!-- ===== FITBIT.COM (entry) ===== -->
    <sc-if value="{{isFitbitCom}}" hint-placeholder-val="{{ false }}">
      <div style="min-height: 100%; background: #fff">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 10px 18px; border-bottom: 1px solid #3E5463">
          <span style="font-size: 24px; font-weight: 800; color: #5B7282; letter-spacing: .01em">fitbit</span>
          <button class="tool" aria-label="Close site menu" style="color: #00828B" onClick="{{noop}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
        <nav aria-label="fitbit.com">
          <sc-for list="{{siteMenu}}" as="m" hint-placeholder-count="8">
            <button class="row {{m.cls}}" onClick="{{m.go}}" style="font-size: 18px; padding: 13px 20px; min-height: 48px">
              <span>{{m.label}}</span>
              <svg width="10" height="16" viewBox="0 0 12 20" fill="none" stroke="#5B7282" stroke-width="1.8" aria-hidden="true"><path d="M2 2l8 8-8 8"></path></svg>
            </button>
          </sc-for>
        </nav>
        <div style="padding: 22px 20px; text-align: center">
          <div style="font-size: 16px; color: #5B7282; margin-bottom: 14px">Track steps, sleep, weight and more.</div>
          <div style="display: flex; justify-content: center; gap: 14px">
            <sc-for list="{{heroDots}}" as="h" hint-placeholder-count="3">
              <div style="width: 74px; height: 74px; border-radius: 50%; background: #C1CCD6; display: flex; align-items: center; justify-content: center">
                <svg width="46" height="13" viewBox="0 17 56 22" aria-hidden="true"><circle cx="7.2" cy="28" r="3.2" fill="#fff"></circle><circle cx="17.6" cy="28" r="3.2" fill="#fff"></circle><circle cx="28" cy="28" r="3.2" fill="#fff"></circle><circle cx="38.4" cy="28" r="3.2" fill="#fff"></circle><circle cx="48.8" cy="28" r="3.2" fill="#fff"></circle></svg>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>

    <!-- ===== CHATBOT ===== -->
    <sc-if value="{{isChat}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; min-height: 100%">
        <div style="padding: 16px 20px 6px; border-bottom: 1px solid #3E5463">
          <h1 style="margin: 0; font-size: 21px; font-weight: 400; color: #00737B">FitBot</h1>
          <div style="font-size: 14px; color: #5B7282">Chat help, no forms to fill out</div>
        </div>
        <div style="flex: 1; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px">
          <sc-for list="{{chatItems}}" as="m" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column">
              <sc-if value="{{m.isBot}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; gap: 8px; align-items: flex-end; max-width: 88%">
                  <div style="width: 30px; height: 30px; border-radius: 50%; background: #00939C; flex: none; display: flex; align-items: center; justify-content: center">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                  </div>
                  <div style="background: #5B7282; color: #fff; border-radius: 16px 16px 16px 4px; padding: 10px 14px; font-size: 16px; line-height: 1.4">
                    <div>{{m.text}}</div>
                    <sc-if value="{{m.hasLink}}" hint-placeholder-val="{{ false }}">
                      <button onClick="{{m.open}}" style="margin-top: 8px; background: #fff; color: #00626A; border: 0; border-radius: 10px; padding: 8px 12px; font-size: 15px; font-weight: 800; cursor: pointer; text-align: left">{{m.linkLabel}}</button>
                    </sc-if>
                  </div>
                </div>
              </sc-if>
              <sc-if value="{{m.isUser}}" hint-placeholder-val="{{ false }}">
                <div style="align-self: flex-end; max-width: 80%; background: #fff; border: 1.5px solid #00828B; color: #00626A; border-radius: 16px 16px 4px 16px; padding: 10px 14px; font-size: 16px; line-height: 1.4">{{m.text}}</div>
              </sc-if>
            </div>
          </sc-for>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px">
            <sc-for list="{{chatSuggestions}}" as="sg" hint-placeholder-count="3">
              <button onClick="{{sg.send}}" style="border: 1.5px solid #00828B; background: #fff; color: #00737B; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 34px">{{sg.label}}</button>
            </sc-for>
          </div>
        </div>
        <form onSubmit="{{sendChat}}" style="position: sticky; bottom: 0; background: #fff; border-top: 1px solid #3E5463; padding: 10px 12px; display: flex; gap: 8px; align-items: center; margin: 0">
          <label for="chatin" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message the help assistant</label>
          <input id="chatin" class="field" placeholder="Describe your issue…" value="{{chatDraft}}" onChange="{{onChatDraft}}" style="padding-right: 18px">
          <button type="submit" aria-label="Send" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #00828B; color: #fff; flex: none; cursor: pointer; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg>
          </button>
        </form>
      </div>
    </sc-if>

    <!-- ===== LOG IN ===== -->
    <sc-if value="{{isLogin}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 10px 24px 30px">
        <div style="display: flex; justify-content: flex-end">
          <button class="tool" aria-label="Close" onClick="{{noThanks}}" style="color: #5B7282">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg>
          </button>
        </div>
        <div style="font-size: 26px; font-weight: 300; color: #00737B; text-align: center; margin: 6px 0 10px">fitbit help</div>
        <h1 style="margin: 0 0 22px; font-size: 19px; font-weight: 400; text-align: center; line-height: 1.4; color: #5B7282">Log in with your Fitbit account so we can better assist you.</h1>
        <form onSubmit="{{doLogin}}" style="display: flex; flex-direction: column; gap: 14px; margin: 0">
          <div>
            <label for="em" style="font-size: 14px; font-weight: 700; display: block; margin-bottom: 4px">Email address</label>
            <input id="em" class="box" type="email" autocomplete="off" placeholder="allie@example.com">
          </div>
          <div>
            <label for="pw" style="font-size: 14px; font-weight: 700; display: block; margin-bottom: 4px">Password</label>
            <input id="pw" class="box" type="password" autocomplete="off" placeholder="••••••••">
          </div>
          <div style="display: flex; justify-content: space-between; gap: 10px; margin-top: 6px">
            <button type="button" class="ghost" onClick="{{noThanks}}" style="flex: 1">No thanks</button>
            <button type="submit" class="pill" style="flex: 1">Go</button>
          </div>
        </form>
        <div style="display: flex; align-items: center; gap: 10px; margin: 22px 0; color: #5B7282; font-size: 14px">
          <div style="flex: 1; height: 1px; background: #3E5463"></div><span>or</span><div style="flex: 1; height: 1px; background: #3E5463"></div>
        </div>
        <button class="ghost" onClick="{{doLogin}}" style="width: 100%; font-size: 17px">Continue with Google</button>
        <p style="font-size: 13px; color: #5B7282; text-align: center; margin: 18px 0 0">Prototype: nothing you type here is sent anywhere.</p>
      </div>
    </sc-if>

    <!-- ===== CONTACT US ===== -->
    <sc-if value="{{isContact}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 20px 20px 10px">
        <h1 style="margin: 0 0 6px; font-size: 22px; font-weight: 400; color: #00737B">Contact support</h1>
        <p style="margin: 0 0 16px; font-size: 16px; color: #5B7282; line-height: 1.45">{{contactIntro}}</p>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <button class="tile" onClick="{{openChat}}" style="flex-direction: row; align-items: center; gap: 14px">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00828B" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
            <span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 800">Chat</span><span style="font-size: 14px; color: #5B7282">Start with the help assistant</span></span>
          </button>
          <button class="tile" onClick="{{noop}}" style="flex-direction: row; align-items: center; gap: 14px">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00828B" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
            <span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 800">Email</span><span style="font-size: 14px; color: #5B7282">We reply within one business day</span></span>
          </button>
          <button class="tile" onClick="{{noop}}" style="flex-direction: row; align-items: center; gap: 14px">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00828B" stroke-width="2" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>
            <span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 800">Phone</span><span style="font-size: 14px; color: #5B7282">[SUPPORT PHONE] · [HOURS]</span></span>
          </button>
          <button class="tile" onClick="{{noop}}" style="flex-direction: row; align-items: center; gap: 14px">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00828B" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-3.5 7.1"></path></svg>
            <span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 800">@FitbitSupport</span><span style="font-size: 14px; color: #5B7282">Message us on social</span></span>
          </button>
          <button class="tile" onClick="{{openForum}}" style="flex-direction: row; align-items: center; gap: 14px">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00828B" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="10" r="2.5"></circle><path d="M3 19a6 6 0 0 1 12 0M14 19a4 4 0 0 1 7 0"></path></svg>
            <span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 800">Community forum</span><span style="font-size: 14px; color: #5B7282">Ask other Fitbit users</span></span>
          </button>
        </div>
      </div>

    <!-- ===== COMMUNITY FORUM ===== -->
    <sc-if value="{{isForum}}" hint-placeholder-val="{{ false }}">

          <button onClick="{{goHome}}" style="background: none; border: 1.5px solid #fff; color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 36px">help home</button>
        </div>
        <sc-if value="{{forumSent}}" hint-placeholder-val="{{ false }}">
          <div style="margin: 16px 16px 0; padding: 12px 14px; border-radius: 12px; background: #E6F4F5; font-size: 15px; line-height: 1.45">

          </div>
        </sc-if>
        <div style="padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px">

    <sc-if value="{{showContactBtn}}" hint-placeholder-val="{{ true }}">

      <footer style="background: rgba(193,204,214,.3); border-top: 1px solid #3E5463; padding: 20px 20px 26px">

          </form>

      ratedGood: s.rating >= 4, ratedBad: s.rating > 0 && s.rating < 4,
      related,

      webQuery: s.webQuery,
      onWebQuery: (e) => this.setState({ webQuery: e.target.value }),
      webSearch: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      webResults: [
        { title: 'Help article: Why isn’t my battery charging? - Fitbit Help', crumb: 'Fitbit › help › articles › en_US › Help_article', snippet: 'If your battery is draining too quickly after a charge, see Can I improve my tracker’s battery life?', open: () => this.go('login', { afterLogin: { screen: 'article', articleId: 'battery' } }) },
        { title: 'Fitbit Help - Battery & Charging', crumb: 'Fitbit › help › c=Topics:Battery', snippet: 'Why isn’t my battery charging? If you’re having difficulty charging your tracker, review these troubleshooting options.', open: () => this.go('results', { resultTerm: 'battery', query: 'battery', listOpen: true }) },
        { title: 'Solved: Charge HR not charging - Fitbit Community', crumb: 'Fitbit › Charge-HR-not-charging › td-p', snippet: 'Cleaned the contacts with a toothbrush and alcohol and it charges again.', open: go('forum') }
      ],

      siteMenu: ['Products', 'Why Fitbit', 'Get Motivated', 'App & Dashboard', 'Help', 'Store', 'Log in', 'Setup'].map((label) => ({
        label, cls: '',
        go: () => {
          if (label === 'Help') this.go('home');
          else if (label === 'Products') this.go('refine');
          else if (label === 'Log in') this.go('login');
          else if (label === 'Setup' || label === 'App & Dashboard') this.openArticle('setup');
        }
      })),
      heroDots: [1, 2, 3],

      chatItems: s.chat.map((m) => ({
        text: m.text, isBot: m.from === 'bot', isUser: m.from === 'user', hasLink: !!m.link, linkLabel: m.linkLabel || '',
        open: () => { if (m.link === 'contact') this.go('contact'); else if (m.link) this.openArticle(m.link); }
      })),
      chatSuggestions: (!s.chatName ? ['My name is Jane'] : (s.chat.length > 3 ? [] : ['My battery won’t charge', 'My run didn’t record', 'Talk to a person'])).map((t) => ({ label: t, send: () => this.pushChat(t) })),
      chatDraft: s.chatDraft,
      onChatDraft: (e) => this.setState({ chatDraft: e.target.value }),
      sendChat: (e) => { if (e && e.preventDefault) e.preventDefault(); this.pushChat(s.chatDraft); },

      doLogin: (e) => { if (e && e.preventDefault) e.preventDefault(); this.leaveLogin(true); },
      noThanks: () => this.leaveLogin(false),

      contactIntro: s.loggedIn ? 'Allie, we can see your Flex 2 and its warranty, so you won’t need to repeat your details.' : 'Log in first and we can see your products and warranty, so you won’t need to repeat your details.',

      forumSections: forumData.map((f) => ({ title: f.title, meta: f.meta, desc: f.desc, threads: f.threads, open: s.forumOpen === f.id, toggle: () => this.setState({ forumOpen: s.forumOpen === f.id ? null : f.id }) })),
      forumSent: s.forumSent, askNotSent: !s.forumSent, forumPost: s.forumPost,
      forumDraft: s.forumDraft,
      forumEmpty: !s.forumDraft.trim(),
      onForumDraft: (e) => this.setState({ forumDraft: e.target.value }),
      sendForum: (e) => { if (e && e.preventDefault) e.preventDefault(); if (!s.forumDraft.trim()) return; this.setState({ forumSent: true, forumPost: s.forumDraft.trim(), forumDraft: '' }); },

      showAsk: ['home', 'results', 'article', 'productPage'].indexOf(scr) >= 0,
      showContactBtn: ['home', 'product', 'device', 'results', 'article', 'productPage', 'refine'].indexOf(scr) >= 0,
      showFooter: isHelp || scr === 'forum',
      showFloatFab: ['results', 'article', 'productPage', 'refine', 'contact'].indexOf(scr) >= 0,
      newsSent: s.newsSent, newsNotSent: !s.newsSent,
      sendNews: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ newsSent: true }); },

      cantBack: s.hist.length === 0,
      cantFwd: s.fwd.length === 0,
      back: () => {
        if (!s.hist.length) return;
        const prev = s.hist[s.hist.length - 1];
        this.setState(Object.assign({}, prev, { hist: s.hist.slice(0, -1), fwd: s.fwd.concat([this.snap()]), menuOpen: false, query: prev.resultTerm && prev.screen === 'results' ? prev.resultTerm : s.query }));
      },
      forward: () => {
        if (!s.fwd.length) return;
        const nx = s.fwd[s.fwd.length - 1];
        this.setState(Object.assign({}, nx, { fwd: s.fwd.slice(0, -1), hist: s.hist.concat([this.snap()]), menuOpen: false }));
      },

      menuItems: [
        { label: 'Home', go: go('home') },
        { label: 'Learn about my product', go: () => this.go(s.product ? 'productPage' : 'refine') },
        { label: 'Popular articles', go: () => this.go('home', { cat: 'popular', listOpen: true }) },
        { label: 'New to Fitbit', go: () => this.go('home', { cat: 'new', listOpen: true }) },
        { label: 'Living with my tracker', go: () => this.go('home', { cat: 'living', listOpen: true }) },
        { label: 'Troubleshooting', go: () => this.go('home', { cat: 'trouble', listOpen: true }) },
        { label: 'FitBot (chat)', go: go('chat') },
        { label: 'Community forum', go: go('forum') },
        { label: 'Contact support', go: go('contact') },
        { label: 'fitbit.com', go: go('fitbitcom') },
        s.loggedIn
          ? { label: 'Log out (Allie)', go: () => this.setState({ loggedIn: false, menuOpen: false }) }
          : { label: 'Log in', go: go('login') }
      ]
    };
  }
}

window.__boot(Component, {"autoplay":true,"preset":"home","showRecentIssues":true,"startLoggedIn":false});
</script>
</body>
</html>
