paths:
  uploads: content/images
  uploads_use_relative_path: false
  static: content
collections_config:
  home:
    path: content/pages
    glob:
      - home.md
    name: Homepage
    icon: home
    url: /
    disable_url: false
    include_developer_files: false
    disable_add: true
    disable_add_folder: false
    disable_file_actions: true
  pages:
    path: content/pages
    glob:
      - '!home.md'
    name: Pages
    icon: article
    url: /[slug]/
    disable_url: false
    include_developer_files: false
    disable_add: true
    disable_add_folder: false
    disable_file_actions: false
  projects:
    path: content/projects
    name: Projects
    singular_name: Project
    icon: work
    url: /work/[slug]/
    disable_url: false
    include_developer_files: false
    _inputs:
      $.categories:
        type: choice
        options:
          allow_empty: true
          values:
          value_key: Service Design
          preview:
            text:
            subtext:
            icon:
            icon_color:
            icon_background_color:
            image:
            metadata:
            gallery:
          required: false
          required_message:
          empty_type:
        cascade: true
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  journal:
    path: content/journal
    name: Journal
    singular_name: Journal entry
    icon: post_add
    url: /journal/[slug]/
    disable_url: false
    include_developer_files: false
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  settings:
    path: content
    glob:
      - site.md
    name: Site settings & SEO
    icon: settings
    disable_url: true
    include_developer_files: false
    disable_add: true
    disable_add_folder: false
    disable_file_actions: true
_enabled_editors:
  - visual
  - content
  - data
_inputs:
  title:
    type: text
    label: Title
    cascade: true
  tagline:
    type: text
    label: One-line summary
    cascade: true
  summary:
    type: textarea
    label: Paragraph shown when the project is opened in More projects
    cascade: true
  client:
    type: text
    cascade: true
  role:
    type: text
    cascade: true
  years:
    type: text
    label: Years shown on the site
    comment: e.g. 2016–2018
    cascade: true
  start_year:
    type: number
    label: Start year
    comment: Sorts the project list
    cascade: true
  section:
    type: select
    options:
      allow_empty: true
      values:
        - work
        - passion
      required: false
    comment: work = Recent work / More projects · passion = Passion projects
    cascade: true
  featured:
    type: switch
    label: Show in Recent work (top three)
    cascade: true
  featured_order:
    type: number
    label: Recent work position (1
    cascade: true
  hidden:
    type: switch
    label: Hide this from the site
    cascade: true
  description:
    type: textarea
    label: SEO description
    comment: 120–160 characters
    cascade: true
  categories:
    type: multiselect
    options:
      allow_create: true
      allow_empty: true
      required: false
    label: Category tags
    cascade: true
  cover:
    type: image
    label: Logo / cover
    comment: Small image in the project rows, the Recent work cards and the journal list
    cascade: true
  cover_alt:
    type: text
    label: Logo / cover description (alt text)
    cascade: true
  drawer_image:
    type: image
    label: Drop-down image
    comment: Shown when the row is opened in More projects (1600 × 1000)
    cascade: true
  drawer_image_alt:
    type: text
    label: Drop-down image description (alt text)
    cascade: true
  logo:
    type: image
    options:
      paths:
        uploads: content/images/logos
        uploads_use_relative_path: false
      disable_upload_file: false
      disable_direct_input: false
      disable_upload_file_in_file_browser: false
      resize_style: contain
      expandable: false
      prevent_resize_existing_files: false
      required: false
    label: Client logo on the project page (optional)
    cascade: true
  top_image:
    type: image
    label: Top image
    comment: Large image under the title; leave empty to show the logo/cover
    cascade: true
  top_image_alt:
    type: text
    label: Top image description (alt text)
    cascade: true
  gallery:
    type: array
    label: Gallery
    comment: Images after the case-study text
    cascade: true
  image:
    type: image
    cascade: true
  alt:
    type: text
    label: Description for screen readers (alt text)
    cascade: true
  caption:
    type: text
    label: Caption (optional)
    cascade: true
  size:
    type: select
    options:
      allow_empty: true
      values:
        - full
        - half
        - third
      required: false
    comment: full = full width · half = two side by side · third = three side by side
    cascade: true
  date:
    type: date
    cascade: true
  category:
    type: text
    comment: Used by the filter on the Journal page
    cascade: true
  excerpt:
    type: textarea
    label: Intro line under the title
    cascade: true
  headline:
    type: text
    comment: Type | where the line should break on desktop
    cascade: true
  portrait:
    type: image
    label: Portrait
    cascade: true
  og_image:
    type: image
    label: Link-preview image (1200 × 630)
    cascade: true
  favicon:
    type: image
    cascade: true
  $.categories:
    cascade: true
_editables:
  content:
    allow_custom_markup: false
    remove_custom_markup: false
    blockquote: true
    bold: true
    bulletedlist: true
    code: false
    copyformatting: false
    embed: false
    expandable: false
    format: p h2 h3 blockquote
    horizontalrule: false
    image: true
    image_size_attributes: false
    indent: false
    italic: true
    link: true
    numberedlist: true
    outdent: false
    redo: true
    removeformat: true
    resize_style: contain
    snippet: true
    strike: false
    subscript: false
    superscript: false
    table: false
    underline: false
    undo: true
timezone: Etc/UTC
