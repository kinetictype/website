# Pages CMS configuration — https://pagescms.org
# Edit this site at https://app.pagescms.org (sign in with GitHub, open kinetictype/website).
# Every "Save" in the CMS is a commit to this repository, which republishes the site.

media:
  - name: images
    label: Images
    input: content/images
    output: /images
    categories: [image]
  - name: files
    label: Files (CV and other downloads)
    input: content/files
    output: /files
    categories: [document]

content:
  # ------------------------------------------------------------
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, section, years, featured]
      sort: [years, start_year, title]
      default:
        sort: start_year
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: tagline, label: One-line summary, type: string }
      - { name: summary, label: Paragraph shown when the project is opened in More projects, type: text }
      - { name: client, label: Client, type: string }
      - { name: role, label: Role, type: string }
      - { name: timeline, label: "At a glance — Year shown under the company name (e.g. 2022–2024); empty = uses Years", type: string }
      - { name: goals, label: "At a glance — Goal: the customer and business goal", type: text }
      - { name: outcome, label: "At a glance — Outcome: what you eventually designed", type: text }
      - { name: responsibilities, label: "At a glance — Responsibilities: what you worked on (visual, interaction, design system, research, concept, usability testing, content design)", type: text }
      - { name: team, label: "At a glance — Team: the roles you worked with", type: text }
      - { name: website, label: "Website link (optional, e.g. https://www.example.com) — shown under the title", type: string }
      - { name: website_label, label: Website link text (optional; leave empty to show the address), type: string }
      - { name: categories, label: Category tags (shown on cards and in the project list), type: string, list: true }
      - { name: years, label: Years shown on the site (e.g. 2016–2018), type: string }
      - name: section
        label: Section
        type: select
        default: work
        options:
          values:
            - { name: work, label: Work (Recent work / More projects) }
            - { name: passion, label: Passion projects }
      - { name: start_year, label: Start year (only used for sorting if Years is empty; the list is ordered by Years, most recent first), type: number }
      - { name: featured, label: Show in Recent work (top three), type: boolean, default: false }
      - { name: featured_order, label: Recent work position (1, 2 or 3), type: number }
      - { name: hidden, label: Hide this project, type: boolean, default: false }
      - { name: description, label: SEO description (120–160 characters), type: text }
      - name: cover
        label: "Logo / cover — small image in the More projects row and on the Recent work card (not shown on the project page; logos live in images/logos)"
        type: image
        options: { media: images, path: content/images/logos }
      - { name: cover_alt, label: Logo / cover description (alt text), type: string }
      - name: drawer_image
        label: "Drop-down image — shown only when the row is opened in More projects (photo or screenshot, 1600 × 1000; keep it in this project's folder in images/projects)"
        type: image
        options: { media: images, path: content/images/projects }
      - { name: drawer_image_alt, label: Drop-down image description (alt text), type: string }
      - name: logo
        label: Client logo on the project page (optional)
        type: image
        options: { media: images, path: content/images/logos }
      - name: top_image
        label: Top image (large, under the title on the project page; leave empty for no image)
        type: image
        options: { media: images, path: content/images/projects }
      - { name: top_image_alt, label: Top image description (alt text), type: string }
      - name: gallery
        label: Gallery (shown after the case-study text, in this order; drag to reorder)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {alt}"
        fields:
          - name: image
            label: Image
            type: image
            options: { media: images, path: content/images/projects }
          - { name: alt, label: Description for screen readers (alt text), type: string }
          - { name: caption, label: Caption under the image (optional), type: string }
          - name: size
            label: Size
            type: select
            default: full
            options:
              values:
                - { name: full, label: Full width }
                - { name: half, label: Half (two side by side) }
                - { name: third, label: Third (three side by side) }
      - name: body
        label: Intro text (opening paragraphs, shown before the sections)
        type: rich-text
        options: { format: markdown, media: images, path: content/images/projects }
      - { name: prototype_url, label: "Prototype — paste the Figma embed code or link (shown after the intro text)", type: text }
      - name: prototype_size
        label: Prototype size
        type: select
        default: half
        options:
          values:
            - { name: half, label: Half the page width }
            - { name: full, label: Full width }
      - { name: prototype_title, label: Prototype name for screen readers (optional), type: string }
      - { name: prototype_caption, label: Caption under the prototype (optional), type: string }
      - name: sections
        label: "Sections — each one: a heading, text, then its images"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {heading}"
        fields:
          - { name: heading, label: Heading (e.g. Product vision, Strategy, Design system, UX), type: string }
          - { name: text, label: Text (paragraphs and bullet lists), type: rich-text, options: { format: markdown } }
          - name: images
            label: Images for this section (shown under its text)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{index}. {alt}"
            fields:
              - name: image
                label: Image
                type: image
                options: { media: images, path: content/images/projects }
              - { name: alt, label: Description for screen readers (alt text), type: string }
              - { name: caption, label: Caption under the image (optional), type: string }
              - name: size
                label: Layout
                type: select
                default: full
                options:
                  values:
                    - { name: full, label: Full width }
                    - { name: half-text, label: "Half, image left with text beside it" }
                    - { name: text-half, label: "Half, text left with image beside it" }
                    - { name: half, label: Half (two images side by side) }
                    - { name: third, label: Third (three images side by side) }
              - { name: text, label: "Text beside the image (for the Half with text layouts)", type: rich-text, options: { format: markdown } }
      - { name: credits_heading, label: "Credits heading (e.g. Team, Crew; default: Team)", type: string }
      - name: credits
        label: "Credits — people you worked with, shown last as Name: role"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: Role, type: string }
          - { name: link, label: Link (optional, e.g. LinkedIn), type: string }
  # ------------------------------------------------------------
  - name: journal
    label: Journal
    type: collection
    path: content/journal
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date, category]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date (shown as DD.MM.YYYY; newest first), type: date, required: true }
      - { name: category, label: Category (used by the filter on the Journal page), type: string }
      - { name: excerpt, label: Intro line under the title on the entry page, type: text }
      - { name: hidden, label: Hide this entry, type: boolean, default: false }
      - { name: description, label: SEO description (120–160 characters), type: text }
      - name: cover
        label: Image (shown 4:3 in the list; 1600 × 1200 works well)
        type: image
        options: { media: images, path: content/images/journal }
      - { name: cover_alt, label: Image description (alt text), type: string }
      - name: body
        label: Entry text
        type: rich-text
        options: { format: markdown, media: images, path: content/images/journal }

  # ------------------------------------------------------------
  - name: home
    label: Homepage
    type: file
    path: content/pages/home.md
    format: yaml-frontmatter
    fields:
      - { name: greeting, label: Greeting (small line above the headline; leave empty to hide), type: string }
      - { name: headline, label: Headline (type | where the line should break on desktop), type: string }
      - { name: subhead, label: Line under the headline (leave empty to hide), type: string }
      - { name: bubble, label: Greeting shown beside the portrait on hover (leave empty to hide), type: string }
      - { name: recent_heading, label: Recent work heading, type: string }
      - { name: archive_heading, label: Project list heading, type: string }
      - { name: passion_heading, label: Passion projects heading, type: string }
      - { name: body, label: Intro paragraph, type: rich-text, options: { format: markdown } }

  - name: work
    label: Work page
    type: file
    path: content/pages/work.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Page title, type: string }
      - { name: description, label: SEO description, type: text }
      - { name: body, label: Intro, type: rich-text, options: { format: markdown } }

  - name: journal_page
    label: Journal page
    type: file
    path: content/pages/journal.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Page title, type: string }
      - { name: description, label: SEO description, type: text }
      - { name: filter_label, label: Text before the category filter, type: string }
      - { name: body, label: Intro line, type: rich-text, options: { format: markdown } }

  - name: contact
    label: Contact page
    type: file
    path: content/pages/contact.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Page title, type: string }
      - { name: description, label: SEO description, type: text }
      - { name: body, label: Text, type: rich-text, options: { format: markdown } }
      - name: cv
        label: CV file (PDF) — a "Download CV" link appears under your email once a file is chosen
        type: file
        options: { media: files, extensions: [pdf] }
      - { name: cv_label, label: "Link text (default: Download CV)", type: string }

  - name: imprint
    label: Imprint (Impressum)
    type: file
    path: content/pages/imprint.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Page title, type: string }
      - { name: description, label: SEO description, type: text }
      - { name: body, label: Text, type: rich-text, options: { format: markdown } }

  - name: privacy
    label: Privacy (Datenschutz)
    type: file
    path: content/pages/privacy.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Page title, type: string }
      - { name: description, label: SEO description, type: text }
      - { name: body, label: Text, type: rich-text, options: { format: markdown } }

  # ------------------------------------------------------------
  - name: settings
    label: Site settings & SEO
    type: file
    path: content/site.md
    format: yaml-frontmatter
    fields:
      - { name: name, label: Your name, type: string, required: true }
      - { name: domain, label: Domain (no https://), type: string, required: true }
      - { name: email, label: Email address, type: string, required: true }
      - { name: site_title, label: Homepage title (browser tab and Google), type: string }
      - { name: description, label: Site description for Google and link previews, type: text }
      - { name: tagline, label: Footer tagline, type: string }
      - { name: job_title, label: Job title (for search engines), type: string }
      - { name: location, label: Location, type: string }
      - { name: portrait, label: Portrait (any shape, shown 320px wide), type: image, options: { media: images, path: content/images } }
      - { name: portrait_alt, label: Portrait description, type: string }
      - { name: og_image, label: Link-preview image (1200 × 630), type: image, options: { media: images, path: content/images } }
      - { name: favicon, label: Favicon, type: image, options: { media: images, path: content/images } }
      - { name: background, label: Background color, type: string }
      - { name: language, label: Language code (en or de), type: string }
      - { name: locale, label: Locale (en_US or de_DE), type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: instagram, label: Instagram URL, type: string }
      - { name: github, label: GitHub URL, type: string }
      - { name: other_profile, label: Other profile URL, type: string }
