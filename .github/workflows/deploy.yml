# Builds the site and publishes it to GitHub Pages every time you push to main
# (every "Save" in Pages CMS is a push to main).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow add the standard sections to a newly created project
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Check that GitHub Pages is turned on
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not turned on::Open the repository on github.com > Settings > Pages, and under 'Build and deployment' set Source to 'GitHub Actions'. On a free GitHub account the repository must be public first (Settings > General > Danger Zone > Change visibility). Then open Actions > Deploy site > Run workflow."
          exit 1
      - run: npm ci
      # A project created in Pages CMS gets the same structure as all the others: Context, Your goal,
      # Design principles & frameworks, Challenges, Showing your designs, Results & outcomes, Learnings
      - name: Add the standard sections to new projects
        run: |
          node scripts/fill-sections.js
          if [ -n "$(git status --porcelain content/projects)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/projects
            git commit -m "Add the standard case-study sections to new projects"
            git pull --rebase origin main && git push origin HEAD:main || echo "Could not save the sections now; the site still shows them and the next save will retry."
          fi
      # base_path is "/website" while the site lives at kinetictype.github.io/website/,
      # and empty once the custom domain kierawestphal.com is connected
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
