# Builds the site and publishes it to GitHub Pages every time you (or Pages CMS) save a change to main.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Plain-language check: publishing needs GitHub Pages switched on for this repository.
      - name: Check that GitHub Pages is turned on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "::error title=GitHub Pages is not turned on::Open Settings → Pages in this repository and set Source to 'GitHub Actions'. On a free GitHub account the repository must be Public (Settings → General → Danger Zone → Change visibility). Then run this workflow again from the Actions tab."
            exit 1
          fi

      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # base_path is "/website" while the site lives at kinetictype.github.io/website/,
      # and empty once the custom domain kierawestphal.com is connected
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
